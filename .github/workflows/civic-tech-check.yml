name: Civic Tech Map Data Check

# 公民科技專案地圖看門狗：每週檢查 civic-tech-map/projects.json，
# 若有欄位錯誤、連結問題或需查證的休眠專案，自動開 / 更新一個 issue 提醒維護者。
# 本 workflow 只讀取資料、不修改檔案，不會產生 commit 或 PR。

on:
  schedule:
    - cron: '30 1 * * 1'   # 每週一 01:30 UTC（台灣時間 09:30），錯開競賽看門狗
  workflow_dispatch:       # 也可在 Actions 頁手動觸發

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: 檢查公民科技專案資料
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Run civic tech data watchdog
        id: check
        run: node scripts/check-civic-tech.mjs

      - name: Open or update issue when attention is needed
        # always() 確保即使 check 步驟以致命錯誤結束（exit 1），只要看門狗已
        # 寫出 needs_attention=true，仍會開 issue 通知維護者。
        if: always() && steps.check.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 確保 label 存在（已存在會報錯，直接忽略）
          gh label create civic-tech-data \
            --color 1D76DB \
            --description "公民科技專案地圖看門狗自動回報" 2>/dev/null || true

          # 若已有開啟中的同類 issue，補上最新報告而不是再開一個
          existing=$(gh issue list \
            --label civic-tech-data --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "已有開啟中的 issue #$existing，補上最新報告。"
            gh issue comment "$existing" --body-file civic-tech-report.md
          else
            gh issue create \
              --title "公民科技專案地圖資料需要更新（自動偵測）" \
              --label civic-tech-data \
              --body-file civic-tech-report.md
          fi
