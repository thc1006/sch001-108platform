name: Deploy to GitHub Pages

# 以 GitHub Actions 建置 Astro 並部署到 GitHub Pages。
# 採用 Astro 官方文件「Deploy to GitHub Pages with GitHub Actions」的範式：
# build job 產出 dist/ 並上傳為 Pages artifact，deploy job 再行部署。
# 注意：Repository Settings → Pages → Source 須設為「GitHub Actions」。

on:
  # 推送到 main 分支時自動部署
  push:
    branches: [ "main" ]
  # 也可在 Actions 頁手動觸發
  workflow_dispatch:

# 允許此 workflow 對 GitHub Pages 做 OIDC 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只允許一個 Pages 部署，新的推送會取消進行中的舊部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build with Astro
        run: npx astro build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
