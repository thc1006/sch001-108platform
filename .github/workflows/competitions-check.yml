name: Competitions Data Check

# 競賽資料看門狗：每週檢查 advanced-resources/competitions.json，
# 若有競賽報名截止日過期、欄位錯誤或官網連結失效，自動開 / 更新一個 issue
# 提醒維護者。連結檢查會實際連線各競賽官網（競賽頁是資料驅動的，這些 url
# 不會進到 build 產物，link-checker.yml 的 lychee 掃不到），故本 job 需連外網路。
# 本 workflow 只讀取資料、不修改檔案，不會產生 commit 或 PR。

on:
  schedule:
    - cron: '0 1 * * 1'   # 每週一 01:00 UTC（台灣時間 09:00）
  workflow_dispatch:       # 也可在 Actions 頁手動觸發

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: 檢查競賽資料
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Run competition data watchdog
        id: check
        timeout-minutes: 15
        run: node scripts/check-competitions.mjs

      # 沒有待辦項目時不會開 issue，報告內容原本無處可見（連「無法判定」清單也看不到）。
      # 一律貼到 job summary，讓每週的檢查結果在 Actions 頁面直接可讀。
      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f competition-report.md ]; then
            cat competition-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '看門狗未產出報告（competition-report.md 不存在）。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update issue when attention is needed
        # always() 確保即使 check 步驟以致命錯誤結束（exit 1），只要看門狗已
        # 寫出 needs_attention=true，仍會開 issue 通知維護者。
        if: always() && steps.check.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 確保 label 存在（已存在會報錯，直接忽略）
          gh label create competition-watchdog \
            --color FBCA04 \
            --description "競賽資料看門狗自動開立的報告（勿手動加此標籤，會被看門狗接管）" 2>/dev/null || true

          # 只接管「看門狗自己開的」issue。專用標籤不可與人工建立的 competition-data
          # 混用——先前兩者同標籤，導致 #70（人工開的內容稽核追蹤）被看門狗接管，
          # 連續四週的週報都貼錯地方。
          # 若已有開啟中的同類 issue，補上最新報告而不是再開一個
          existing=$(gh issue list \
            --label competition-watchdog --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "已有開啟中的 issue #$existing，補上最新報告。"
            gh issue comment "$existing" --body-file competition-report.md
          else
            gh issue create \
              --title "競賽資料需要更新（自動偵測）" \
              --label competition-watchdog \
              --body-file competition-report.md
          fi
