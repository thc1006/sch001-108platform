name: CI

# 每個 PR 都必須跑的確定性檢查，以及 main 的部署。
#
# 檢查與部署放在同一個 workflow 是刻意的。先前 deploy.yml 是獨立觸發的，會用
# npm install（CI 用 npm ci）重新建置**另一份** dist/ 然後直接上線——被驗證的
# artifact 和被部署的不是同一份，中間任何差異都不會有人發現。現在 deploy job
# 部署的就是 site job 檢查過的那一份位元組。
#
# 這些 job 不探測第三方網站的可用性——外部站台
# 今天連不連得上屬於非確定性，不該讓無關的 PR 變紅。
# （仍會用到 npm registry 與 GitHub Actions 本身，那是基礎設施而非受檢對象。）
#
# 「全站外部連結」的排程健檢在 external-links-check.yml（#72 的最後一塊），
# 每週一在 main 上跑，讀 check:site 產出的網址盤點去實際連線。本檔仍然不做那件事：
# 外部站台今天連不連得上與這次改動無關，不該讓 PR 變紅。
#
# 本檔對外部網址只做**確定性**的那一半——check:link-policy 會檢查每個外部網址是否
# 違反位址政策（指向 loopback／私網／雲端 metadata／內嵌帳密），以及例外政策有沒有
# 過期。這兩件事不需要連線就能判定，所以擋在 PR 階段；「站台今天活著嗎」才留給排程。
#
# 觸發條件刻意不限制 base 分支：先前寫 `pull_request: branches: [main]`，導致
# 堆疊 PR（#73 的 base 是 feature 分支）一個 check 都沒跑，連 schema 驗證與
# watchdog 測試都被繞過——而那個 PR 改的正是 competitions schema 與前端狀態機。
on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
  # 手動重新部署。原本在 deploy.yml，合併進來時必須一起保留——沒有它就只能靠
  # 推一個空 commit 才能重跑部署。
  workflow_dispatch:

# 同一個 PR 推新 commit 時取消還在跑的舊 run；push 到 main 時退回 run_id，確保
# 每次 push 各自獨立、不會互相取消。
#
# 用 PR 編號而不是 head_ref：head_ref 是**純分支名稱不含 owner**，兩個來自不同
# fork、分支同樣叫 patch-1 或 main 的 PR 會落進同一個 group 並互相取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# workflow 層級是「地板」：任何日後新增而忘記寫 permissions 的 job 都只會拿到
# contents: read。但地板不等於宣告——底下每個 job 都再各自寫一次自己真正需要的
# 範圍，理由有二：
#   1. 這一行被誰放寬（或被搬走）時，不會連帶把六個 job 一起放寬。
#   2. 讀 job 的人不必往上翻檔頭才知道它拿得到什麼 token。
# 倉庫設定 default_workflow_permissions 只對「完全沒有 permissions 鍵」的 job 生效，
# 所以把它收成 read 之後本檔的有效權限一格都不會變：2026-08-27 main 的 run
# 33120520304 六個 job 的日誌實測就已經是 Contents: read（deploy 另有 Pages: write），
# 而當時倉庫預設仍是 write。
permissions:
  contents: read

jobs:
  site:
    name: Site Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # checkout + npm ci + upload-pages-artifact。artifact 走 Actions runtime token，
    # 不吃 GITHUB_TOKEN 的 actions 範圍，所以這裡只需要讀原始碼。
    permissions:
      contents: read
    steps:
      # 第三方 action 一律 pin 到完整 commit SHA：tag 是可移動的，而這幾支 action
      # 正好站在 merge integrity 的邊界上。三個 SHA 都已對 GitHub API 查證。
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 這個 job 之後不需要任何 authenticated git 操作，不要把 token 留在 .git/config
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 先跑純函式測試：契約核心壞掉時，讓失敗訊息停在單元測試而不是一堆站台錯誤
      - name: Run site-contract unit tests
        run: npm run test:site-integrity

      # 建置「實際會被部署的那一份」——包含 search index。先前 Build Search Index
      # 與 Internal Links 各自 build 一次，被驗證的 artifact 和被檢查的不是同一份。
      - name: Build the deployable artifact
        run: npm run build:deployable

      - name: Verify built-site contracts
        run: npm run check:site

      # check:site 會產出 .reports/url-inventory.json（實測 499 個去重外部網址）。
      # 這一步在盤點上做確定性檢查：任何指向 loopback／私有網段／link-local／雲端
      # metadata／內嵌帳密的外部網址，都在合併前就擋下來，而不是等每週排程跑到才
      # 發現——那時候它已經在 main 上了。同時檢查 link-policy.json 的例外有沒有過期。
      - name: Verify external URL policy (deterministic, no network)
        run: npm run check:link-policy

      # 故障注入：逐一破壞一個契約，確認 checker 真的會擋。
      # 「正常狀態綠燈」證明不了 checker 有在把關——那正是本 issue 要修的假象本身。
      - name: Prove the checker actually blocks (fault injection)
        run: npm run test:site-faults

      # 分類欄位（素養／SDGs／議題標籤）的故障注入。放在 site job 是因為它要
      # 一份建置產物才能驗「錨點對不上時建置會不會失敗」。同樣在副本上注入，
      # 上面那份要部署的 dist/ 不會被動到。
      - name: Prove the taxonomy validators actually block (fault injection)
        run: npm run test:taxonomy-faults

      # 相依樹的故障注入。package.json 宣告 tailwindcss: "^4.3.3"（caret），而
      # @tailwindcss/vite@4.3.3 對 tailwindcss 是精確 pin 4.3.3——只要其中一邊被
      # 單獨升級就會長出 split tree：樹裡同時存在兩個 tailwindcss 版本，npm install
      # exit 0、零警告，但 Vite 外掛拿巢狀那份引擎編譯 CSS，產出悄悄不一致。
      # 這一關證明守衛真的會擋，而不是「現在剛好沒事」。
      #
      # 相依：npm run test:deps-faults 由 fix/tailwind-split-tree-guard 提供，
      # 那支 PR 必須先合併，否則這一步會找不到 script。
      - name: Prove the dependency-tree guard actually blocks (fault injection)
        run: npm run test:deps-faults

      # astro.config.mjs 設 base: '/sch001-108platform'，站內連結都是根相對路徑。
      # lychee 對本機檔案的根相對連結會在「解析」階段就失敗，而 --exclude 與
      # --scheme 都是解析之後才生效（lycheeverse/lychee#2125），因此必須重建與
      # GitHub Pages 相同的路徑命名空間，再用 --root-dir 指向它。
      - name: Stage GitHub Pages path namespace
        run: |
          rm -rf "$GITHUB_WORKSPACE/.link-root"
          mkdir -p "$GITHUB_WORKSPACE/.link-root/sch001-108platform"
          cp -a dist/. "$GITHUB_WORKSPACE/.link-root/sch001-108platform/"

      # 第二層 defense-in-depth。主要把關者是上面的 check:site（它懂本站的契約：
      # 目錄 index、同源絕對網址、runtime JSON reference、canonical 自我一致性）；
      # lychee 負責補上通用的連結擷取，抓我們可能沒想到的來源。
      #   --index-files      ：目錄式連結必須有 index.html，不是目錄存在就算數
      #   --include-fragments：預設完全不檢查 fragment，必須顯式開啟
      #   fail/failIfEmpty   ：v2 預設雖已是 true，但這是安全關鍵的把關政策，顯式寫出
      #   token: ''          ：只檢查 file:// 不需要 GitHub API token
      - name: Defense-in-depth link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          token: ''
          fail: true
          failIfEmpty: true
          lycheeVersion: v0.24.2
          args: >-
            --root-dir "${{ github.workspace }}/.link-root"
            --scheme file
            --index-files index.html
            --include-fragments=anchor-only
            --verbose
            --no-progress
            './.link-root/sch001-108platform/**/*.html'

      # 放在 job 的最後一步：上傳的就是通過上面每一項檢查的那一份 dist/。
      # 任何一步紅了，這步不會執行，也就沒有 artifact 可部署。
      #
      # 故障注入是在 dist/ 的副本上做的（見 check-built-site.faults.mjs），
      # 所以這裡上傳的內容與 check:site 驗證的完全相同。
      #
      # 刻意「不」限定只在 main 上傳。限定的話，打包這一步只會在合併之後才第一次
      # 執行——真的壞掉時，PR 全綠、合併、然後 main 的部署才紅。每個 PR 都跑一次，
      # 打包失敗就在 PR 階段擋下。artifact 預設保留 1 天，成本可忽略。
      - name: Upload the artifact that passed every check
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # 靜態檢查證明得了「這個 URL 指得到東西」，證明不了「頁面在瀏覽器裡跑得起來」。
  # 競賽頁與資源頁都是資料驅動的——瀏覽器先 fetch() JSON 再渲染。JSON 壞掉或前端
  # JS 丟例外時，check:site 全綠、build 成功，使用者只看到空白容器。這個 job 補那
  # 一段：在真的 Chromium 裡開頁面，等資料渲染出來，且不接受任何 console error、
  # pageerror 或本站資源的失敗請求。
  #
  # 它第一次跑就抓到首頁用 hostname.endsWith('github.io') 分支硬寫搜尋索引路徑——
  # 在正式站上剛好成立，換自訂網域或本機預覽就整個失效。
  browser:
    name: Browser Tests
    # 刻意「不」自己重新 build，而是拿 site job 上傳的那一份。理由與 deploy job
    # 完全相同：如果這裡另外 build 一份來測，被測的就不是會被部署的那一份，
    # 這個 job 的綠燈也就證明不了部署出去的東西沒問題。
    needs: [site]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # download-artifact 取的是**同一個 run** 的 artifact，走 runtime token；
    # 只有跨 run 下載（run-id + github-token）才需要 actions: read。
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 只裝 chromium：這些是前端邏輯與渲染測試，跨瀏覽器差異不是這裡要驗的東西。
      #
      # --only-shell 再省一層：不指定 channel 的 headless 執行用的是 chromium
      # headless shell（約 104 MiB），不是完整的 Chromium（約 174 MiB）。本 repo 的
      # projects 只有 devices['Desktop Chrome']，實測它沒有 channel 欄位，測試也全程
      # headless，所以完整版下載下來根本不會被啟動。（有人日後加上 channel 或改跑
      # headed 時，失敗的會是**下面跑測試那一步**——它找不到完整瀏覽器的執行檔；
      # 這個安裝步驟本身仍然會成功。那時把 --only-shell 拿掉即可。）
      #
      # --with-deps 必須保留：版面預算測試量的是中文字型實際排出來的高度，少了 OS
      # 層的字型相依會讓量測漂移，那比省下的下載時間貴得多。
      #
      # 刻意不快取瀏覽器：版本跟 Playwright 綁在一起，而 cache 體積大，restore 未必
      # 比從 CDN 下載便宜。要改的話請先量 p50/p95，不要憑單次數字決定。
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      # site job 通過全部靜態檢查後上傳的那一份。upload-pages-artifact 內部包成
      # artifact.tar，所以這裡要解開。
      # v8 才把 digest 不符的預設行為從 warning 改成 error（新增 digest-mismatch
      # 參數，預設 'error'）。整個 CI 的論點是「被驗證的位元組 == 被部署的位元組」，
      # 而 v7 遇到雜湊不符只會印一行警告然後繼續——那等於這個論點沒有被檢查。
      - name: Download the artifact that passed the static checks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: github-pages

      # site smoke test 要在 GitHub Pages 的路徑命名空間下跑：站台連結都是根相對
      # 路徑，直接從產物根目錄開會全部指錯地方，測不出真實行為。
      - name: Unpack into the GitHub Pages path namespace
        run: |
          rm -rf "$GITHUB_WORKSPACE/.link-root"
          mkdir -p "$GITHUB_WORKSPACE/.link-root/sch001-108platform"
          tar -xf artifact.tar -C "$GITHUB_WORKSPACE/.link-root/sch001-108platform"
          test -f "$GITHUB_WORKSPACE/.link-root/sch001-108platform/index.html"
          test -f "$GITHUB_WORKSPACE/.link-root/sch001-108platform/search-index.json"

      - name: Run browser tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  data:
    name: Validate Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --no-link-check：不連外網，確保這個關卡的結果只取決於這次改動
      - name: Validate competition data (schema only)
        run: npm run check:competitions

      - name: Run watchdog probe/schema unit tests
        run: npm run test:watchdog

      # schema 綠燈只證明「格式合法」，證明不了「值是對的」。逐筆開過官網查證的
      # 競賽，其報名時程／賽事日期／官網網址在這裡被釘住——被改回錯的值就會紅。
      # 沒有這一關的話，#63 → #66 → #68 那種「格式全過、內容全錯」的資料仍然
      # 可以一路合併進 main。
      - name: Run per-entry verified-data regression tests
        run: npm run test:competitions-data

      # 公民科技專案資料的 schema。先前只掛在每週排程的 civic-tech-check.yml 上,
      # 於是改壞 projects.json 的 PR 全綠合併,最快也要等到下週一才會有人知道。
      # 這支不連外網、只驗結構,完全確定性,本來就該在每個 PR 上跑。
      - name: Validate civic tech project data (schema only)
        run: npm run check:civic-tech

      # 連結健檢的 SSRF 防護與例外政策。這些測試打本機 http server（不依賴外網），
      # 只有兩處會查 DNS：.invalid（RFC 6761 保證 NXDOMAIN）與 nip.io（查不到時
      # 會顯式跳過而不是靜默通過）。
      - name: Run link-health SSRF and policy unit tests
        run: npm run test:link-health

      # 故障注入：逐一拿掉一段 SSRF 防護、逐一破壞一條例外政策規則，確認該紅的
      # 真的會紅。「測試會過」證明不了「測試在把關」——#72 的起因正是這種假象。
      - name: Prove the guards actually block (fault injection)
        run: npm run test:link-faults

  # 固定名稱的聚合關卡。ruleset 只要求這一個 context，日後 job 改名或增減都不必
  # 同步調整 repository 設定——避免 workflow 與 ruleset 漂移。
  # if: always() 確保任一上游 job 被取消或失敗時本 job 仍會執行並判定為失敗，
  # 而不是一起被跳過（被跳過的 required check 會讓 PR 永遠等不到結果）。
  required:
    name: CI Required
    if: ${{ always() }}
    needs: [site, data, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 這個 job 不 checkout、不呼叫任何 API，只讀 needs.*.result 然後 echo/test。
    # 它同時是 ruleset 唯一的 required check，也就是最不該握著任何 token 的那一個。
    # `{}` 表示所有範圍都設為 none（Metadata: read 是平台一律附帶、關不掉的）。
    permissions: {}
    steps:
      - name: Require every deterministic job to have succeeded
        env:
          SITE_RESULT: ${{ needs.site.result }}
          DATA_RESULT: ${{ needs.data.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Site Integrity : $SITE_RESULT"
          echo "Validate Data  : $DATA_RESULT"
          echo "Browser Tests  : $BROWSER_RESULT"
          test "$SITE_RESULT" = "success"
          test "$DATA_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"

  # 只有在 CI Required 通過後才部署，而且部署的是 site job 上傳的那一份 artifact，
  # 不是重新建置的。needs: required 是這裡的關鍵——它讓「通過檢查」成為部署的
  # 前置條件，而不是兩件平行發生、誰快誰先上線的事。
  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-latest
    # 必須明顯大於 actions/deploy-pages 自己的 10 分鐘上限，且要容納下面的一次重試。
    #
    # 實際踩過：原本這裡是 10 分鐘，而 deploy-pages 的 timeout 預設也正好是 600000ms。
    # GitHub Pages 的 updating_pages 階段變慢時（2026-08-27 當天就是如此），job 逾時
    # 先把整個 job 砍掉，action 來不及回報自己的錯誤——而**逾時被砍的 job 在 UI 上
    # 顯示成 cancelled，不是 failure**。實測兩次都是恰好 10m03s / 10m05s。
    timeout-minutes: 25
    # 權限只給這個 job。其餘 job 維持 workflow 層級的 contents: read。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 同時間只允許一個 Pages 部署。放在 job 層級而非 workflow 層級：workflow 的
    # concurrency group 依 run 區分（push 到 main 時每個 run 都必須各自跑完），
    # 兩者管的是不同的事。
    #
    # queue: max —— 預設是 queue: single，一個 group 只留得住**一個** pending。連續
    # 推第三次時，還在排隊的第二次會被直接取消，那個 commit 就這樣沒有部署，而且 job
    # 顯示成 cancelled 而不是 failure。queue: max 讓同一個 group 最多排 100 個並依
    # FIFO 依序處理。已對 GitHub 真正的 workflow parser schema 查證：job-concurrency
    # 與 workflow-concurrency 指向同一個 concurrency-mapping，queue 的 allowed-values
    # 是 ["single", "max"]，所以 job 層級可用。
    #
    # 注意 queue: max 與 cancel-in-progress: true 併用會是 workflow 驗證錯誤；這裡
    # 本來就必須是 false——部署不可以被後來的 run 砍掉。
    #
    # 還要注意 FIFO 是依「開始等待這個 group 的時間」排序，不是依 commit 順序。各 run
    # 的 CI 耗時本來就有落差（實測整條 run 331～414 秒），所以較舊的 commit 仍有可能
    # 最後才部署，讓線上停在比 main 更舊的版本。那件事不是這把鎖能處理的，由
    # verify-deploy 去抓——它會發現線上是自己的祖先。
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      # 刻意不傳 timeout 參數。MAX_TIMEOUT = 600000 寫死在 action 裡
      # （src/internal/deployment.js:26，第 58 行是
      #  this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)），傳更大的值只會被靜默
      # 夾回去並多印一行警告——寫 timeout: 900000 看起來像 15 分鐘，實際仍是 10 分鐘。
      # 這個上限對齊 Pages 平台本身「部署超過 10 分鐘就失敗」的限制，所以正確做法
      # 不是等更久，而是失敗後重試一次。
      - name: Deploy the verified artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # Pages 後端偶發會讓部署卡到平台的 10 分鐘上限（actions/deploy-pages#406，
      # 2026-01 開至今未修；#418 同類）。第一次卡到 action 自己的 MAX_TIMEOUT 時，
      # 它走的是 check() → core.setFailed('Timeout reached, aborting!') → this.cancel()
      # → cancelPagesDeployment，會把那個 deployment 主動取消掉，所以第二次是乾淨的
      # 重新開始。（不是 SIGTERM handler——那條路徑只在 runner 主動送訊號時才會走到。）
      #
      # 這是唯一能把「後端抖動」變成「最終成功」的手段——等更久沒有用，平台端本來
      # 就會在 10 分鐘砍掉。
      #
      # 這一步同樣掛 continue-on-error：沒有的話它一失敗就直接讓 job 結束，下面那個
      # 「兩次都沒成功」的步驟永遠不會執行（隱含的 success() 前置條件不成立），
      # 錯誤訊息也就少掉「去看 githubstatus」這句可執行的指引。
      - name: Retry once if the first attempt did not land
        if: ${{ steps.deployment.outcome == 'failure' }}
        id: deployment-retry
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # continue-on-error 會讓失敗的 step 不影響 job 結論，所以兩次都失敗時要自己喊。
      - name: Fail when neither attempt landed
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome != 'success' }}
        run: |
          echo "兩次部署都沒有成功。請到 https://www.githubstatus.com/ 確認 Pages 是否異常。" >&2
          exit 1

  # deploy-pages 成功只證明「部署請求被接受」，證明不了站台在服務新內容。
  #
  # #89 合併後實際發生過：五個 job 有四個成功、GitHub 的 deployments API 有該
  # commit 的紀錄，但線上服務的仍是舊版本（vendor/fuse.min.js 回 404），而且完全
  # 沒有訊號——因為 deploy 只在 push 到 main 時跑，不可能列入 PR 的 required check，
  # 而 main 的 run 顯示的是 cancelled，沒有人會去看。
  #
  # 這個 job 刻意**不**放進 deploy 的 pages concurrency group，也刻意不併進 deploy
  # job。它要回答的問題是「站台現在到底在服務什麼」，而那個問題只有在鎖外面才問得
  # 出來——在鎖裡面驗，就只能確認「我剛剛部署的東西部署好了」，永遠看不到別人後來
  # 把站台換成了什麼。
  #
  # 對應地，verify-deploy.mjs 的判定不是「精確相等」而是「相等或線上是我的後代」：
  # 較新的部署先上線是正常的，不該誤報；線上若是本 commit 的祖先才是真的有問題。
  verify-deploy:
    name: Verify Deployment Landed
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: [deploy]
    runs-on: ubuntu-latest
    # 線上的 Cache-Control 是 max-age=600，所以輪詢預算必須大於 10 分鐘，否則
    # 「CDN 還沒過期」本身就足以讓這一關誤報失敗（見 verify-deploy.mjs）。
    #
    # 預算組成（腳本最壞路徑，走的是「後代命中」那條——它的落地輪比精確命中多一次
    # compare）：660 秒輪詢預算 ＋ 落地輪的 build-info 15 秒與 compare 15 秒 ＝ 690 秒；
    # 接著 45 秒再確認，再加上再確認自己的 build-info 15 秒與 compare 15 秒 ＝ 765 秒。
    # step 給 14 分鐘（840 秒），留約 75 秒。job 再加 checkout 約 10 秒、setup-node
    # 約 15～30 秒、runner 起停約 30～60 秒 ≈ 965 秒，所以 job 給 18 分鐘。
    #
    # 重點是 step 的上限**必須小於** job 的上限：step 逾時的結果是 failure、訊息明確；
    # job 逾時被砍的結果是 cancelled，那正是 #92 當初沒人發現的形狀。
    timeout-minutes: 18
    # 這個 job 會 checkout、對線上站台發 HTTPS 請求，並且用 GITHUB_TOKEN 打 GitHub 的
    # compare API，判斷線上的 commit 是不是本 commit 的後代（見 verify-deploy.mjs）。
    #
    # 所以這裡**必須**是 contents: read，不能是 {}。給 {} 的話 compare 會 401，而腳本
    # 對「查不出關係」的處置是繼續等——於是它會靜默退回「精確相等」那條舊判定，main
    # 連續合併時的誤報就回來了，日誌卻只會說「線上仍是 X，繼續等」，看起來像部署慢。
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      # deploy 被取消或失敗時就不必等了，直接指出問題——否則要空等到逾時。
      - name: Fail fast when the deploy job did not succeed
        if: ${{ needs.deploy.result != 'success' }}
        run: |
          echo "Deploy job 的結果是「${{ needs.deploy.result }}」，站台不會更新。" >&2
          echo "常見原因：被較新的 run 取消、GitHub Pages 服務異常、Pages 來源設定不是 GitHub Actions。" >&2
          exit 1

      # 給 step 自己的逾時，比腳本的 660 秒預算多一點。用 step timeout 而不是只靠
      # job timeout：step 逾時的結果是 failure、訊息明確；job 逾時被砍的結果是
      # cancelled，那正是 #92 當初沒人發現的形狀。
      #
      # GITHUB_TOKEN 是給 compare API 用的（查線上的 commit 是不是本 commit 的後代）。
      # 公開 repo 不給也能查，但配額低很多；GITHUB_REPOSITORY 由 Actions 自動提供。
      - name: Verify the live site serves this commit
        timeout-minutes: 14
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:deploy

  # 固定名稱的部署關卡，本身不持有任何權限。
  #
  # 為什麼需要它：job 因為 timeout-minutes 被砍、或因為 concurrency 被取代時，UI 上
  # 顯示的是 cancelled 而不是 failure，整個 run 的結論也跟著是 cancelled——#92 就是
  # 這樣連續兩次部署沒落地卻沒有任何人發現。這個 job 用 always() 明確比對上游結果，
  # 把「被取消」與「被跳過」都變成紅燈。
  #
  # ⚠️ 不要把這個 check 加進 branch ruleset。它只在 push／workflow_dispatch 到 main
  # 時執行，在 PR 上永遠是 skipped，而被跳過的 required check 會讓 PR 永遠等不到
  # 結果（同樣的理由見上面 required job 的註解）。PR 的關卡只有「CI Required」。
  deployment-required:
    name: Deployment Required
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: [deploy, verify-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require deployment and live verification
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-deploy.result }}
        run: |
          echo "Deploy to GitHub Pages   : $DEPLOY_RESULT"
          echo "Verify Deployment Landed : $VERIFY_RESULT"
          test "$DEPLOY_RESULT" = "success"
          test "$VERIFY_RESULT" = "success"
