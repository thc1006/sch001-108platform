name: CI

# 每個 PR 都跑的確定性檢查，以及 main 的部署。部署的是同一個 run 裡通過檢查的
# artifact，不另外建置。這裡不連線檢查站上的外部連結，結果才不會隨外站狀況變動；
# 外部連結由 external-links-check.yml 每週檢查。

# 不限 base 分支，堆疊 PR 也要跑（#73）。不加 paths 過濾：workflow 沒有跑時，
# 必要檢查 CI Required 會一直停在等待。
on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:
  workflow_dispatch: # 手動重新部署

# 用 PR 編號分組，不用 head_ref：head_ref 不含 owner，不同 fork 同名分支的 PR
# 會互相取消。不是 PR 時退回 run_id，push 到 main 的 run 不會互相取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# 漏寫 permissions 的 job 只拿到這一層。每個 job 仍寫出自己要的權限，這一層
# 放寬了也不會影響它們。
permissions:
  contents: read

jobs:
  # 這個 job 的相依只裝一次：建置、靜態檢查、上傳 artifact，再下載同一份跑瀏覽器測試。
  # 瀏覽器測試失敗而重跑時，建置與靜態檢查也會重跑。
  site:
    name: Site and Browser Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # artifact 的上傳與下載走 runtime token，不需要 actions 權限。
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # cache 只存 npm 的下載快取，不存 node_modules：每次都先過閘門，再由 npm ci
      # 在 strict-allow-scripts 下重新安裝相依。
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # 閘門要在 npm ci 之前，安裝期 script 一跑就來不及了。
      # 根 package.json 的安裝期 script 連 strict-allow-scripts 都管不到。
      - name: Verify the install-script gate is in effect (before installing)
        run: node scripts/check-install-gate.mjs

      # 安裝時不查 advisory：查詢卡住時 npm ci 要等滿 fetch-timeout，預設 5 分鐘。
      # 漏洞由 Dependabot alerts 追蹤。
      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Run site-contract unit tests
        run: npm run test:site-integrity

      - name: Build the deployable artifact
        # 閘道網址來自 repository variable，不寫進 repo。BaseLayout.astro 把它寫進
        # 每頁的 meta，沒設定時不寫，改走閘道的 AI 功能會回報尚未設定。
        env:
          PUBLIC_AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        run: npm run build:deployable

      - name: Verify built-site contracts
        # 和建置那一步同一個值，check:site 才比對得出產物有沒有反映設定。BaseLayout
        # 讀的變數名稱被改掉時，產物整批沒有閘道網址，只看產物前後一致抓不到。
        env:
          PUBLIC_AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        run: npm run check:site

      # link-policy 讀 check:site 寫出的 .reports/url-inventory.json，要排在它後面。
      - name: Verify external URL policy (deterministic, no network)
        run: npm run check:link-policy

      # 站內連結是 /sch001-108platform/ 開頭的根相對路徑。lychee 檢查本機檔案時要有
      # --root-dir 才解析得了這類連結，否則在解析階段就報錯，--exclude 和 --scheme
      # 也排除不掉（lycheeverse/lychee#2125）。所以照 Pages 的路徑複製一份給它。
      - name: Stage GitHub Pages path namespace
        run: |
          rm -rf "$GITHUB_WORKSPACE/.link-root"
          mkdir -p "$GITHUB_WORKSPACE/.link-root/sch001-108platform"
          cp -a dist/. "$GITHUB_WORKSPACE/.link-root/sch001-108platform/"

      # fail、failIfEmpty 是預設值也寫出來，預設改了檢查才不會永遠通過（#72）。
      # 少了 --index-files，目錄存在就算連結有效，Pages 卻要有 index.html。
      # 只查 file://，不需要 token。
      - name: Defense-in-depth link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          token: ''
          fail: true
          failIfEmpty: true
          lycheeVersion: v0.24.2
          args: >-
            --root-dir "${{ github.workspace }}/.link-root"
            --scheme file
            --index-files index.html
            --include-fragments=anchor-only
            --verbose
            --no-progress
            './.link-root/sch001-108platform/**/*.html'

      # 名稱帶 run_attempt：重跑這個 job 時，前一次上傳的 artifact 還在，
      # deploy-pages 找到同名的多份就失敗（actions/deploy-pages#338）。只重跑 deploy
      # 時 run_attempt 會變，所以 deploy 從 job output 拿名稱，不自己組。
      - name: Name this artifact
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # 上傳的是通過靜態檢查的那份，瀏覽器測試還沒跑。測試失敗時它仍留在 run 裡，
      # 但 CI Required 不通過就不會部署。PR 也上傳，打包失敗才會在合併前出現。
      # upload-pages-artifact 預設只保留 1 天，過期後只重跑 deploy 會拿不到它。
      - name: Upload the candidate artifact
        id: pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist

      # runner 的 apt 照 apt-mirrors.txt 每行的 priority 選鏡像，數字小的先用，
      # azure.archive.ubuntu.com 是 1。azure 慢的時候仍有資料在傳，apt 不會換到
      # 下一個（actions/runner-images#14823），下一步 --with-deps 要裝的套件就只能
      # 從它慢慢下載。拿掉 azure 的 priority，沒有 priority 的鏡像最後才用。
      # TODO(thc1006): actions/runner-images#14823 修好後拿掉這一步。
      - name: Move the Azure apt mirror to the end
        run: |
          f=/etc/apt/apt-mirrors.txt
          [ -f "$f" ] || { echo "$f 不存在，不改。"; exit 0; }
          sudo sed -i '/azure\.archive\.ubuntu\.com/s/priority:[0-9]*//' "$f"
          cat "$f"

      # 只裝 headless shell，改用 channel 或 headed 時拿掉 --only-shell。
      # 版面預算要靠 --with-deps 裝的中文字型。瀏覽器不快取，Playwright 也不建議。
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      # 依 ID 下載剛上傳的那份並驗 digest：測的就是會被部署的位元組，
      # 連 Pages 的打包也在內。
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.pages.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-download
          digest-mismatch: error

      # 先清空 .link-root，測到的只會是下載的 artifact，
      # 不會是前面為 lychee 放進去的 dist。
      - name: Unpack into the GitHub Pages path namespace
        run: |
          rm -rf "$GITHUB_WORKSPACE/.link-root"
          mkdir -p "$GITHUB_WORKSPACE/.link-root/sch001-108platform"
          tar -xf "$RUNNER_TEMP/pages-download/artifact.tar" -C "$GITHUB_WORKSPACE/.link-root/sch001-108platform"
          test -f "$GITHUB_WORKSPACE/.link-root/sch001-108platform/index.html"
          test -f "$GITHUB_WORKSPACE/.link-root/sch001-108platform/search-index.json"

      # Playwright 的整體逾時 10 分鐘短於 step 的 12 分鐘，逾時時由 Playwright
      # 收尾並寫出報告。設定檔在 CI 只用 list 與 github，這裡再加 html，失敗時上傳的
      # playwright-report/ 才有內容。
      - name: Run browser tests
        id: browser
        timeout-minutes: 12
        run: npx playwright test --global-timeout=600000 --add-reporter=html

      - name: Upload Playwright report on failure
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 這三組故障測試要先建置。這裡自己建一份，和 site 平行跑，瀏覽器測試不必等它們。
  # 相依樹與安裝閘門的故障測試用不到建置產物，在 Validate Data 跑。
  faults:
    name: Built-Site Fault Injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # 和 site 一樣，閘門要在 npm ci 之前。
      - name: Verify the install-script gate is in effect (before installing)
        run: node scripts/check-install-gate.mjs

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      # 建置設定和 site 相同。site-faults 會先拿掉閘道 meta，這個值不影響三組的結果。
      - name: Build the deployable artifact
        env:
          PUBLIC_AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        run: npm run build:deployable

      - name: Prove the checker actually blocks (fault injection)
        run: npm run test:site-faults

      - name: Prove the taxonomy validators actually block (fault injection)
        run: npm run test:taxonomy-faults

      - name: Prove the vendor size budget actually blocks (fault injection)
        run: npm run test:vendor-size-faults

  data:
    name: Validate Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # 這些指令只用 Node 內建模組與 repo 裡的模組，所以不安裝相依。加入第三方 import
    # 時，要改回先跑閘門再 npm ci。package.json 沒有指定 packageManager，所以
    # package-manager-cache: false 現在不改變行為；日後指定了，setup-node 也不會在
    # 不安裝相依的 job 自動開快取。
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Validate competition data (schema only)
        run: npm run check:competitions

      - name: Run watchdog probe/schema unit tests
        run: npm run test:watchdog

      - name: Run per-entry verified-data regression tests
        run: npm run test:competitions-data

      - name: Check activity-database fields and status badges
        run: npm run test:activity-database

      - name: Prove the activity-database checks actually block (fault injection)
        run: npm run test:activity-faults

      - name: Test the quote-audit matching logic (network half stays manual)
        run: npm run test:quote-audit

      - name: Validate civic tech project data (schema only)
        run: npm run check:civic-tech

      - name: Run admission-cycle unit tests
        run: npm run test:admission-cycle

      - name: Prove the admission-cycle check actually blocks (fault injection)
        run: npm run test:admission-cycle-faults

      # 過了 remindAfter 只印警告，這一步的結果不看今天的日期。
      - name: Check admission-cycle years in content
        run: npm run check:admission-cycle

      - name: Run link-health SSRF and policy unit tests
        run: npm run test:link-health

      - name: Prove the guards actually block (fault injection)
        run: npm run test:link-faults

      - name: Prove the dependency-tree guard actually blocks (fault injection)
        run: npm run test:deps-faults

      - name: Prove the install-script gate actually blocks (fault injection)
        run: npm run test:install-gate-faults

      - name: Test deployment verification
        run: npm run test:verify-deploy

      - name: Run comment-checker unit tests
        run: npm run test:comments

      - name: Check comment length
        run: npm run check:comments

  # 測試只打本機的假 WinLab，不需要 key；WinLab 的 key 只接受校內的來源 IP，
  # runner 本來就連不上。閘道只用 Node 內建模組，所以不跑 npm ci，也不需要
  # 安裝期腳本閘門。不用 sparse checkout：blob 會改在 git checkout 時才下載，
  # 而 actions/checkout 只重試 fetch。
  gateway:
    name: AI Gateway Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      # source-hygiene 被移出清單時，它對清單的比對也跟著消失。這裡不經清單直接執行，
      # 檔案被刪或改名時 node --test 找不到它，以 1 結束。
      - name: Check the gateway test list
        run: node --test ai-gateway/test/source-hygiene.test.mjs

      # 單一測試卡住由 --test-timeout 判失敗。測試檔留下沒關的 handle 時子程序不會
      # 結束，由這一步的上限判 failure，不會拖到 job 逾時變成 cancelled（#92）。
      - name: Run AI gateway tests
        timeout-minutes: 2
        run: npm run test:ai-gateway

  # ruleset 只認 CI Required 這個名稱，其他 job 改名或增減時，改這裡的 needs 與
  # 下面的檢查。上游失敗時，沒有 always() 的 job 會被跳過，而被跳過的 job 算通過；
  # 所以這裡用 always() 執行，再逐一確認上游是 success。
  required:
    name: CI Required
    if: ${{ always() }}
    needs: [site, faults, data, gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every deterministic job to have succeeded
        env:
          SITE_RESULT: ${{ needs.site.result }}
          FAULTS_RESULT: ${{ needs.faults.result }}
          DATA_RESULT: ${{ needs.data.result }}
          GATEWAY_RESULT: ${{ needs.gateway.result }}
        run: |
          echo "Site and Browser Integrity : $SITE_RESULT"
          echo "Built-Site Fault Injection : $FAULTS_RESULT"
          echo "Validate Data              : $DATA_RESULT"
          echo "AI Gateway Tests           : $GATEWAY_RESULT"
          test "$SITE_RESULT" = "success"
          test "$FAULTS_RESULT" = "success"
          test "$DATA_RESULT" = "success"
          test "$GATEWAY_RESULT" = "success"

  # CI Required 通過才部署。deploy-pages 依 site 輸出的名稱取 artifact，needs 要列
  # site 才讀得到 outputs。它每次的逾時是 10 分鐘，25 分鐘容得下重試一次，不會先被
  # job 逾時砍掉；job 逾時在 UI 只顯示 cancelled，不是 failure（#92）。
  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [required, site]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment-retry.outputs.page_url || steps.deployment.outputs.page_url }}
    # 同一時間只部署一次。預設的 queue: single 只留一個等待中的 job，連推三次時中間
    # 那個 commit 不會部署；max 最多排 100 個，不能和 cancel-in-progress: true 併用。
    # 排隊依開始等待的時間而不是 commit 先後，較舊的 run 晚到就會蓋掉較新的版本。
    # 這把鎖擋不住；新版的 verify-deploy 結束後才被蓋掉的話，沒有檢查會失敗。
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      # 不傳 timeout：deploy-pages v5.0.1 的單次上限寫死 600000 ms，傳更大的值會被
      # 夾回，所以失敗時由下一步重試。
      - name: Deploy the verified artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.site.outputs.artifact_name }}

      # Pages 部署偶爾逾時或失敗（actions/deploy-pages#406、#418）。逾時時 action 會
      # 取消那次部署，重試是重新開始。這一步也要 continue-on-error，下一步才跑得到。
      - name: Retry once if the first attempt did not land
        if: ${{ steps.deployment.outcome == 'failure' }}
        id: deployment-retry
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.site.outputs.artifact_name }}

      - name: Fail when neither attempt landed
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome != 'success' }}
        run: |
          echo "兩次部署都沒有成功。請到 https://www.githubstatus.com/ 確認 Pages 是否異常。" >&2
          exit 1

  # deploy-pages 會等到 Pages API 回報部署完成，但 CDN 可能還在給舊版，所以輪詢期限
  # 要長於線上快取的 max-age，數字在 verify-deploy.mjs。不放進 pages 鎖：要看站台
  # 此刻實際服務的版本，包括之後別的 run 部署的，所以接受本 commit 或它的後代；
  # 同一個 commit 還要是這次或之後的 run 建的。
  # 腳本最壞要 765 秒：輪詢 660 秒，最後一輪的 build-info 與 compare 請求各 15 秒，
  # 再等 45 秒，再確認的兩個請求又各 15 秒。step 給 14 分鐘，job 給 18 分鐘，
  # step 要先逾時：step 逾時是 failure，job 逾時是 cancelled（#92）。
  verify-deploy:
    name: Verify Deployment Landed
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    # 這個 job 會 checkout，verify-deploy.mjs 也用 GITHUB_TOKEN 呼叫 compare API
    # 判斷後代，所以是 contents: read。
    permissions:
      contents: read
    steps:
      - name: Fail fast when the deploy job did not succeed
        if: ${{ needs.deploy.result != 'success' }}
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          echo "Deploy job 的結果是「$DEPLOY_RESULT」，站台不會更新。" >&2
          echo "常見原因：CI Required 沒過時 deploy 是 skipped；其他是部署被取消、GitHub Pages 服務異常、Pages 來源設定不是 GitHub Actions。" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Verify the live site serves this commit
        timeout-minutes: 14
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 和建置那一步同一個值。Re-run 時 run 編號不變，要再比閘道網址。
          PUBLIC_AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
        run: npm run verify:deploy

  # 部署或驗證被取消、跳過也算失敗：取消的 job 不會顯示成 failure，部署沒落地時
  # 容易沒人發現（#92）。不要加進 ruleset：PR 上它被 if 跳過，而跳過算通過，
  # 只會多一個永遠通過的必要檢查。
  deployment-required:
    name: Deployment Required
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: [deploy, verify-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require deployment and live verification
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-deploy.result }}
        run: |
          echo "Deploy to GitHub Pages   : $DEPLOY_RESULT"
          echo "Verify Deployment Landed : $VERIFY_RESULT"
          test "$DEPLOY_RESULT" = "success"
          test "$VERIFY_RESULT" = "success"
