name: Build, Test and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-index:
    name: Build Search Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build search index
        run: node build-search-index.js

      - name: Create Pull Request for search index
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(bot): 自動更新搜尋索引"
          title: "chore(bot): 自動更新搜尋索引"
          body: "由 CI 自動產生：搜尋索引檔案已更新。"
          branch: chore/update-search-index
          delete-branch: true
          add-paths: search-index.json

  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    needs: build-and-index # 等待索引建立完成後再執行
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.html' './**/*.md' './advanced-resources/competitions.json' './advanced-resources/online-courses.json'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
