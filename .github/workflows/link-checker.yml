name: Build, Test and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-index:
    name: Build Search Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 遷移到 Astro 後，實際頁面與資產 JSON 由 astro build 產生在 dist/，
      # build-search-index.js 掃的是 dist/，故必須先建置。
      - name: Build Astro site
        run: npx astro build

      - name: Build search index
        run: node build-search-index.js

      # search-index.json 現在輸出在 dist/ 內、隨 deploy.yml 一起部署，
      # 故不再需要回寫 repo 根目錄、也不再開 PR 更新索引。

  # 競賽頁是資料驅動的，lychee 掃 dist/*.html 看不到 competitions.json 裡的欄位與
  # 網址，故在 PR 階段另跑看門狗的 schema 驗證與探測邏輯單元測試。兩者都不連外網：
  # schema 驗證用 --no-link-check，單元測試打本機 http server，不會因站台狀態而飄。
  validate-data:
    name: Validate Data & Watchdog Logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Validate competition data (schema only)
        run: npm run check:competitions

      - name: Run watchdog probe/schema unit tests
        run: npm run test:watchdog

  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # lychee 掃的是建置產物，故需在此 job 內重新建置 dist/。
      - name: Build Astro site
        run: npx astro build

      # v1 預設「發現壞連結也不讓 job 失敗」，等於這個檢查一直是裝飾性的；
      # v2 起預設 fail=true，此處刻意不覆寫，讓 HTML 連結的檢查真正具備把關能力。
      # 若日後因外部站台暫時性故障而頻繁誤擋，再評估改用 --accept 放寬狀態碼，
      # 而不是整個關掉失敗行為。
      - uses: lycheeverse/lychee-action@v2
        with:
          # 掃描 astro build 產物 dist/ 內的 .html。內部 /sch001-108platform/ 連結
          # 由 Astro 建置與遷移稽核保證,且 lychee 對 base 前綴的根相對路徑無法
          # 對應到本機 dist/,故排除;lychee 專注檢查外部連結的可用性。
          args: --verbose --no-progress --exclude '^/sch001-108platform' './dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
