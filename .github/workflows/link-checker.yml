name: Build, Test and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-index:
    name: Build Search Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 遷移到 Astro 後，實際頁面與資產 JSON 由 astro build 產生在 dist/，
      # build-search-index.js 掃的是 dist/，故必須先建置。
      - name: Build Astro site
        run: npx astro build

      - name: Build search index
        run: node build-search-index.js

      # search-index.json 現在輸出在 dist/ 內、隨 deploy.yml 一起部署，
      # 故不再需要回寫 repo 根目錄、也不再開 PR 更新索引。

  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # lychee 掃的是建置產物，故需在此 job 內重新建置 dist/。
      - name: Build Astro site
        run: npx astro build

      - uses: lycheeverse/lychee-action@v1
        with:
          # 掃描 astro build 產物 dist/ 內的 .html。內部 /sch001-108platform/ 連結
          # 由 Astro 建置與遷移稽核保證,且 lychee 對 base 前綴的根相對路徑無法
          # 對應到本機 dist/,故排除;lychee 專注檢查外部連結的可用性。
          args: --verbose --no-progress --exclude '^/sch001-108platform' './dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
