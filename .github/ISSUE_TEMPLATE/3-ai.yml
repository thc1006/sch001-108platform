name: AI 功能問題
description: AI 功能出現錯誤訊息、沒有回應，或回答有問題。
title: "[AI] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        這裡寫的內容和你的 GitHub 帳號名稱，任何人都看得到。請不要寫姓名、學校、班級、電話、電子郵件等個人資料，截圖也一樣。不想公開的話，可以寫信到 hctsai@linux.com。
  - type: dropdown
    id: feature
    attributes:
      label: 哪一個功能
      options:
        - AI 推薦學群（生涯探索）
        - AI 對照核心素養（核心素養互動探索）
        - 讓 AI 幫你挑（公民科技專案）
        - AI 學習啟動包（自主學習）
        - AI 個人化發想（主題靈感產生器）
        - AI 計畫草擬工具（計畫範本庫）
        - AI 規劃學習路徑（學習資源地圖）
        - AI 學習歷程健檢（學習歷程）
        - AI 學習歷程健檢（反思引導提問集）
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 發生時間
      description: 日期和大概幾點。
      placeholder: 例如：2026-10-31 21:30
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: 畫面上看到什麼
      description: 有錯誤訊息的話照抄，或附截圖。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 瀏覽器和裝置
      placeholder: 例如：iPhone Safari、Windows Chrome
  - type: textarea
    id: typed
    attributes:
      label: 你輸入的內容
      description: 也會公開，有個人資料就不要貼。
