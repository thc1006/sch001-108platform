# action 都釘在完整 commit SHA，不會自己拿到上游修正，也不會有 Dependabot 警示。
# 安全性修正也要靠下面的版本更新，Dependabot 開的 PR 仍釘在 SHA。
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    # 新版發布滿 7 天才開 PR，沒寫時預設 3 天；GitHub Actions 只支援 default-days。
    cooldown:
      default-days: 7
    groups:
      # 官方 actions/* 的 minor 與 patch 常在同一週一起出，併成一個 PR。
      # major 與 lychee-action 這類第三方 action 各自開 PR，方便逐一審。
      official-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - 'actions/*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # 與 .npmrc 的 min-release-age=7 對齊。沒有這一段的話那道閘門形同虛設：
    # Dependabot 自己算 lockfile，而 npm ci 不重新解析，min-release-age 只擋得到
    # 本機的 install/update，擋不到這條路徑。預設是 3 天，不是沒有。
    # cooldown 不套用在 security update 上，安全性修正不會被延後；它也只管被升級的那個
    # 套件本身，管不到 lockfile 裡跟著重新解析的間接相依（dependabot-core#14683）。
    cooldown:
      default-days: 7

    groups:
      # 分在一組是為了一起審。只有 tailwindcss 出新版時照樣單獨升級，相依樹會分裂，
      # 擋下它的是 scripts/check-dep-tree.mjs，原因與實測寫在那裡。
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      # 這三個由 scripts/vendor-assets.mjs 複製到 public/vendor/，版本一動，
      # 使用者下載的檔案就跟著變，分成一組一起審。
      vendored-frontend:
        patterns:
          - 'fuse.js'
          - 'feather-icons'
          - 'ionicons'
      # astro 與官方 integration 常一起發版，一起升、一起審。
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
