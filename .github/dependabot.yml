# action 都釘在完整 commit SHA，不會自己拿到上游修正，也不會有 Dependabot 警示。
# 安全性修正也要靠下面的版本更新，Dependabot 開的 PR 仍釘在 SHA。
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    # 新版發布滿 7 天才開 PR，沒寫時預設 3 天；GitHub Actions 只支援 default-days。
    cooldown:
      default-days: 7
    groups:
      # 官方 actions/* 的 minor 與 patch 常在同一週一起出，併成一個 PR。
      # major 與 lychee-action 這類第三方 action 各自開 PR，方便逐一審。
      official-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - 'actions/*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # 與 .npmrc 的 min-release-age 一起改。Dependabot 取兩者較大的天數（dependabot-core#15132），
    # 更新 lockfile 時 npm 也照 .npmrc 擋下太新的間接相依。security update 的例外見 SECURITY.md。
    cooldown:
      default-days: 7

    groups:
      # 分在一組是為了一起審。只有 tailwindcss 出新版時照樣單獨升級，相依樹會分裂，
      # 擋下它的是 scripts/check-dep-tree.mjs，原因與實測寫在那裡。
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      # 這三個由 scripts/vendor-assets.mjs 複製到 public/vendor/，版本一動，
      # 使用者下載的檔案就跟著變，分成一組一起審。
      vendored-frontend:
        patterns:
          - 'fuse.js'
          - 'feather-icons'
          - 'ionicons'
      # astro 與官方 integration 常一起發版，一起升、一起審。
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'

  # AI 閘道映像檔的基底（Containerfile 的 FROM），版本與 digest 一起升。
  # Dependabot 認得 Containerfile 這個檔名（dependabot-core#11141）。
  - package-ecosystem: 'docker'
    directory: '/ai-gateway/deploy/k3s'
    # 同目錄的 Kubernetes manifest 也會被當成映像檔來源；裡面的 image 是本機建的，Dependabot 查不到。
    exclude-paths:
      - '*.yaml'
      - '*.yml'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ai-gateway)'
    # Docker 只支援 default-days。
    cooldown:
      default-days: 7
    # Node 主版本要人工升（.node-version、Containerfile 的註解要一起改）。
    ignore:
      - dependency-name: 'library/node'
        update-types: ['version-update:semver-major']
